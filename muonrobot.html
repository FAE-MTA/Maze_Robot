<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký mượn Robot - Robot mê cung 2026</title>

<style>
:root{
  --bg:#061b45;
  --panel:#0b2a5a;
  --panel2:#0e356f;
  --cyan:#00eaff;
  --gold:#ffd54a;
  --green:#2bdc91;
  --blue:#1f8cff;
  --red:#ff5d67;
  --expired:#8b93a7;
  --text:#ffffff;
  --muted:rgba(255,255,255,.72);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

.home{
  position:fixed;
  top:14px;
  right:14px;
  z-index:50;
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(0,234,255,.28);
  color:white;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  backdrop-filter:blur(8px);
}

.header{
  text-align:center;
  padding:42px 16px 16px;
}

.header h1{
  margin:0;
  font-size:30px;
  letter-spacing:.5px;
}

.header p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:14px;
}

.wrap{
  width:min(1450px,97vw);
  margin:0 auto 40px;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:14px;
}

.badge{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  padding:8px 13px;
  font-size:12px;
}

.badge b{color:var(--gold)}

.legend{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  font-size:12px;
  margin-bottom:12px;
  color:var(--muted);
}

.legend span{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:3px;
  display:inline-block;
}

.seat-board{
  background:linear-gradient(180deg,rgba(11,42,90,.96),rgba(5,24,58,.96));
  border:1px solid rgba(0,234,255,.2);
  border-radius:20px;
  padding:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.42);
}

.board-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.board-title h2{
  margin:0;
  font-size:18px;
  color:var(--cyan);
}

.hint{
  color:var(--muted);
  font-size:12px;
}

.grid-scroll{
  overflow:auto;
  padding-bottom:6px;
}

.seat-grid{
  width:100%;
  min-width:1100px;
  border-collapse:separate;
  border-spacing:7px;
}

.seat-grid th{
  font-size:11px;
  color:rgba(255,255,255,.82);
  font-weight:700;
  text-align:center;
  padding:4px;
}

.robot-cell{
  width:92px;
  min-width:92px;
  text-align:center;
  font-weight:900;
  color:var(--gold);
  border-radius:10px;
  background:rgba(255,215,74,.08);
  border:1px solid rgba(255,215,74,.18);
  padding:8px 6px;
}

.robot-cell small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
}

.seat{
  min-width:115px;
  height:72px;
  border-radius:12px;
  padding:7px;
  text-align:center;
  vertical-align:middle;
  cursor:pointer;
  transition:.18s ease;
  border:1px solid transparent;
  position:relative;
  user-select:none;
}

.seat:hover{
  transform:translateY(-2px);
}

.seat.free{
  background:rgba(43,220,145,.13);
  border-color:rgba(43,220,145,.42);
}

.seat.free:hover{
  box-shadow:0 0 18px rgba(43,220,145,.28);
}

.seat.booked{
  background:rgba(31,140,255,.15);
  border-color:rgba(31,140,255,.46);
}

.seat.borrowing{
  background:rgba(255,213,74,.14);
  border-color:rgba(255,213,74,.46);
}

.seat.returned{
  background:rgba(255,255,255,.06);
  border-color:rgba(255,255,255,.12);
  opacity:.68;
}

.seat.expired{
  background:rgba(139,147,167,.10);
  border-color:rgba(139,147,167,.24);
  opacity:.55;
  cursor:not-allowed;
}

.seat.expired:hover{
  transform:none;
  box-shadow:none;
}

.seat .status{
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:4px;
}

.seat.free .status{color:var(--green)}
.seat.booked .status{color:#74b7ff}
.seat.borrowing .status{color:var(--gold)}
.seat.returned .status{color:#d1d5db}
.seat.expired .status{color:#c5cad6}

.seat .team{
  font-size:11px;
  line-height:1.18;
  font-weight:700;
  min-height:25px;
  overflow:hidden;
}

.seat .date{
  font-size:9px;
  color:var(--muted);
  margin-top:4px;
}

.group-divider td{
  height:4px;
  background:transparent;
  padding:0;
}

.group-label td{
  padding:8px 4px 2px;
  color:var(--cyan);
  font-weight:900;
  font-size:12px;
  letter-spacing:.4px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,7,24,.78);
  backdrop-filter:blur(8px);
}

.modal.show{display:flex}

.modal-card{
  width:min(540px,96vw);
  background:#082653;
  border:1px solid rgba(0,234,255,.35);
  border-radius:20px;
  padding:18px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}

.modal-card h3{
  margin:0 0 12px;
  color:var(--gold);
}

.booking-meta{
  background:rgba(0,234,255,.07);
  border:1px solid rgba(0,234,255,.14);
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.6;
  margin-bottom:12px;
}

.field{margin-top:10px}

.field label{
  display:block;
  font-size:12px;
  margin-bottom:5px;
  color:var(--muted);
}

.field input,.field select{
  width:100%;
  height:44px;
  border-radius:11px;
  border:1px solid rgba(0,234,255,.22);
  background:#0c326b;
  color:white;
  padding:0 12px;
  outline:none;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

.btn{
  border:none;
  border-radius:11px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}

.btn.cancel{
  background:rgba(255,255,255,.1);
  color:white;
}

.btn.ok{
  background:linear-gradient(135deg,#00a5ff,#00eaff);
  color:#06214b;
}

.note{
  margin-top:12px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}

@media(max-width:768px){
  .header{padding-top:66px}
  .header h1{font-size:23px}
  .wrap{width:98vw}
  .seat-board{padding:9px;border-radius:14px}
  .seat-grid{min-width:1020px;border-spacing:5px}
  .seat{min-width:105px;height:68px}
  .robot-cell{min-width:80px;width:80px}
}
</style>
</head>

<body>

<a href="index_2.html" class="home">🏠</a>

<div class="header">
  <h1>ĐĂNG KÝ MƯỢN ROBOT</h1>
  </div>

<div class="wrap">

  <div class="legend">
    <span><i class="dot" style="background:#2bdc91"></i>Còn trống</span>
    <span><i class="dot" style="background:#1f8cff"></i>Đã đăng ký</span>
    <span><i class="dot" style="background:#ffd54a"></i>Đang mượn</span>
    <span><i class="dot" style="background:#9ca3af"></i>Đã trả</span>
    <span><i class="dot" style="background:#8b93a7"></i>Hết hạn</span>
  </div>

  <div class="seat-board">
    <div class="board-title">
      <h2>SƠ ĐỒ 16 ROBOT</h2>
      <div class="hint">Bấm vào ô màu xanh để đăng ký</div>
    </div>

    <div class="grid-scroll">
      <table class="seat-grid" id="seatGrid"></table>
    </div>
  </div>

  <div class="note">
    Dữ liệu đăng ký được đồng bộ trực tiếp với Google Sheets.
  </div>

</div>

<div class="modal" id="bookingModal">
  <div class="modal-card">
    <h3>ĐĂNG KÝ MƯỢN ROBOT</h3>

    <div class="booking-meta" id="bookingMeta"></div>

    <div class="field">
      <label>Tên đội</label>
      <select id="teamName">
        <option value="">-- Chọn đội --</option>
      </select>
    </div>

    <div class="field">
      <label>Người nhận robot</label>
      <input id="borrowerName" placeholder="Họ và tên">
    </div>

    <div class="field">
      <label>Số điện thoại</label>
      <input id="borrowerPhone" inputmode="tel" placeholder="Số điện thoại liên hệ">
    </div>

    <div class="actions">
      <button class="btn cancel" onclick="closeModal()">Hủy</button>
      <button class="btn ok" onclick="confirmBooking()">Xác nhận đăng ký</button>
    </div>
  </div>
</div>


<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw5hAhnDwG2dKZXoBJP-jbWD0zb3N2OQ89pO-umCJoVgBxMvKXJzZ03oF51z7osN6Er/exec";

let selected = null;
let teams = [];
let bookings = [];

const slots = [
  {slot:1, from:"17/08", to:"20/08", end:"2026-08-20T23:59:59+07:00"},
  {slot:2, from:"21/08", to:"24/08", end:"2026-08-24T23:59:59+07:00"},
  {slot:3, from:"25/08", to:"28/08", end:"2026-08-28T23:59:59+07:00"},
  {slot:4, from:"29/08", to:"01/09", end:"2026-09-01T23:59:59+07:00"},
  {slot:5, from:"02/09", to:"05/09", end:"2026-09-05T23:59:59+07:00"},
  {slot:6, from:"06/09", to:"09/09", end:"2026-09-09T23:59:59+07:00"},
  {slot:7, from:"10/09", to:"13/09", end:"2026-09-13T23:59:59+07:00"},
  {slot:8, from:"14/09", to:"17/09", end:"2026-09-17T23:59:59+07:00"}
];

const robots = [
  ...Array.from({length:3},(_,i)=>({code:`QS${String(i+1).padStart(2,"0")}`,group:"Quân sự"})),
  ...Array.from({length:11},(_,i)=>({code:`DS${String(i+1).padStart(2,"0")}`,group:"Dân sự"})),
  ...Array.from({length:2},(_,i)=>({code:`THPT${String(i+1).padStart(2,"0")}`,group:"THPT"}))
];

function isSlotExpired(slot){
  return new Date() > new Date(slot.end);
}

async function api(params = {}){
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  url.searchParams.set("_", Date.now());

  const res = await fetch(url.toString(), {cache:"no-store"});
  if(!res.ok) throw new Error("Không kết nối được hệ thống đăng ký.");
  return await res.json();
}

async function loadData(){
  try{
    const data = await api({action:"bootstrap"});
    if(!data.ok) throw new Error(data.message || "Không tải được dữ liệu.");

    teams = (data.teams || []).filter(t => t.allowed !== false);
    bookings = data.bookings || [];

    populateTeams();
    renderGrid();
  }catch(err){
    console.error(err);
    alert("Không tải được dữ liệu đăng ký: " + err.message);
    renderGrid();
  }
}

function populateTeams(){
  const select = document.getElementById("teamName");
  select.innerHTML = '<option value="">-- Chọn đội --</option>' +
    teams.map(t => `<option value="${escapeAttr(t.name)}">${escapeHTML(t.name)} — ${escapeHTML(t.group)}</option>`).join("");
}

function bookingAt(robot,slot){
  return bookings.find(b =>
    b.robot === robot &&
    Number(b.slot) === Number(slot) &&
    String(b.status || "").toUpperCase() !== "HỦY"
  );
}

function statusClass(status){
  const s = String(status || "").toUpperCase();
  if(s === "ĐÃ NHẬN ROBOT") return "borrowing";
  if(s === "ĐÃ TRẢ") return "returned";
  return "booked";
}

function statusLabel(status){
  const s = String(status || "").toUpperCase();
  if(s === "ĐÃ NHẬN ROBOT") return "Đang mượn";
  if(s === "ĐÃ TRẢ") return "Đã trả";
  if(s === "HỦY") return "Đã hủy";
  return "Đã đăng ký";
}

function renderGrid(){
  const grid = document.getElementById("seatGrid");

  let out = "<thead><tr><th>Robot</th>";
  slots.forEach(s=>{
    out += `<th>Slot ${s.slot}<br>${s.from} → ${s.to}</th>`;
  });
  out += "</tr></thead><tbody>";

  let lastGroup = "";

  robots.forEach((r,index)=>{
    if(r.group !== lastGroup){
      if(index>0) out += `<tr class="group-divider"><td colspan="9"></td></tr>`;
      out += `<tr class="group-label"><td colspan="9">${r.group.toUpperCase()}</td></tr>`;
      lastGroup = r.group;
    }

    out += `<tr><td class="robot-cell">${r.code}<small>${r.group}</small></td>`;

    slots.forEach(s=>{
      const b = bookingAt(r.code,s.slot);

      if(b){
        out += `
          <td class="seat ${statusClass(b.status)}" onclick="showBooking('${r.code}',${s.slot})">
            <div class="status">${statusLabel(b.status)}</div>
            <div class="team">${escapeHTML(b.team)}</div>
            <div class="date">${s.from} → ${s.to}</div>
          </td>`;
      } else if(isSlotExpired(s)){
        out += `
          <td class="seat expired">
            <div class="status">Hết hạn</div>
            <div class="team">Không thể đăng ký</div>
            <div class="date">${s.from} → ${s.to}</div>
          </td>`;
      } else {
        out += `
          <td class="seat free" onclick="openBooking('${r.code}',${s.slot})">
            <div class="status">Còn trống</div>
            <div class="team">+ Đăng ký</div>
            <div class="date">${s.from} → ${s.to}</div>
          </td>`;
      }
    });

    out += "</tr>";
  });

  out += "</tbody>";
  grid.innerHTML = out;
}

function openBooking(robot,slotNo){
  const slot = slots.find(s=>s.slot===slotNo);
  if(!slot || isSlotExpired(slot)){
    alert("Slot này đã hết hạn đăng ký.");
    return;
  }

  selected = {robot,slot:slotNo};
  const robotInfo = robots.find(r=>r.code===robot);

  document.getElementById("bookingMeta").innerHTML = `
    Robot: <b>${robot}</b><br>
    Nhóm: <b>${escapeHTML(robotInfo.group)}</b><br>
    Slot: <b>${slotNo}</b><br>
    Thời gian: <b>${slot.from} → ${slot.to}</b>
  `;

  // chỉ hiển thị đội đúng nhóm robot
  const select = document.getElementById("teamName");
  const eligible = teams.filter(t => t.group === robotInfo.group);
  select.innerHTML = '<option value="">-- Chọn đội --</option>' +
    eligible.map(t => `<option value="${escapeAttr(t.name)}">${escapeHTML(t.name)}</option>`).join("");

  document.getElementById("borrowerName").value = "";
  document.getElementById("borrowerPhone").value = "";
  document.getElementById("bookingModal").classList.add("show");
}

function closeModal(){
  document.getElementById("bookingModal").classList.remove("show");
  selected = null;
}

async function confirmBooking(){
  const team = document.getElementById("teamName").value.trim();
  const borrower = document.getElementById("borrowerName").value.trim();
  const phone = document.getElementById("borrowerPhone").value.trim();

  if(!selected) return;

  if(!team || !borrower || !phone){
    alert("Vui lòng nhập đầy đủ thông tin.");
    return;
  }

  const button = document.querySelector(".btn.ok");
  button.disabled = true;
  button.textContent = "Đang đăng ký...";

  try{
    const result = await api({
      action:"book",
      team,
      robot:selected.robot,
      slot:selected.slot,
      borrower,
      phone
    });

    if(!result.ok){
      alert(result.message || "Không đăng ký được.");
      return;
    }

    alert("Đăng ký mượn robot thành công.");
    closeModal();
    await loadData();

  }catch(err){
    alert("Lỗi đăng ký: " + err.message);
  }finally{
    button.disabled = false;
    button.textContent = "Xác nhận đăng ký";
  }
}

function showBooking(robot,slotNo){
  const b = bookingAt(robot,slotNo);
  if(!b) return;

  const slot = slots.find(s=>s.slot===slotNo);

  alert(
    `Robot: ${robot}
` +
    `Thời gian: ${slot.from} → ${slot.to}
` +
    `Đội: ${b.team}
` +
    `Người nhận: ${b.borrower || ""}
` +
    `SĐT: ${b.phone || ""}
` +
    `Trạng thái: ${statusLabel(b.status)}`
  );
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHTML(value);
}

loadData();

  // Tự đồng bộ trạng thái từ Google Sheets mỗi 20 giây.
  setInterval(() => {
    if (!document.hidden) loadData();
  }, 20000);

  // Khi quay lại tab/trang, tải lại dữ liệu ngay.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) loadData();
  });
</script>


</body>
</html>
